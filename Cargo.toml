[package]
name = "enrg-hft"
version = "0.1.0"
edition = "2021"
description = "ENRG-HFT — hybrid scalping bot: HTX WebSocket + quant core + DeepSeek risk manager"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
rust_decimal = { version = "1", features = ["serde"] }
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
